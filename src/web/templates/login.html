<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - TTS SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <!-- Logo et titre -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center mb-4">
                <svg class="w-12 h-12 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-gray-900">TTS SaaS</h1>
            <p class="text-gray-600 mt-2">Synthèse vocale nouvelle génération</p>
        </div>

        <!-- Formulaire de connexion -->
        <div class="bg-white rounded-lg shadow-xl p-8">
            <h2 class="text-2xl font-semibold text-gray-900 mb-6 text-center">Se connecter</h2>
            
            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        Adresse email
                    </label>
                    <input type="email" id="email" name="email" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="votre@email.com"
                           value="test@example.com">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        Mot de passe
                    </label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="••••••••"
                           value="Test123!">
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        <span class="ml-2 text-sm text-gray-600">Se souvenir de moi</span>
                    </label>
                    <a href="#" class="text-sm text-blue-600 hover:text-blue-500">
                        Mot de passe oublié ?
                    </a>
                </div>

                <button type="submit" 
                        class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors duration-200 flex items-center justify-center">
                    <svg id="loginSpinner" class="hidden animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span id="loginText">Se connecter</span>
                </button>
            </form>

            <!-- Message d'alerte -->
            <div id="alertMessage" class="hidden mt-4 p-4 rounded-lg"></div>

            <!-- Lien d'inscription -->
            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    Pas encore de compte ?
                    <button onclick="showRegisterForm()" class="text-blue-600 hover:text-blue-500 font-medium">
                        S'inscrire gratuitement
                    </button>
                </p>
            </div>
        </div>

        <!-- Formulaire d'inscription (caché par défaut) -->
        <div id="registerCard" class="hidden bg-white rounded-lg shadow-xl p-8 mt-4">
            <h2 class="text-2xl font-semibold text-gray-900 mb-6 text-center">S'inscrire</h2>
            
            <form id="registerForm" class="space-y-6">
                <div>
                    <label for="regFullName" class="block text-sm font-medium text-gray-700 mb-2">
                        Nom complet
                    </label>
                    <input type="text" id="regFullName" name="full_name" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Jean Dupont">
                </div>

                <div>
                    <label for="regEmail" class="block text-sm font-medium text-gray-700 mb-2">
                        Adresse email
                    </label>
                    <input type="email" id="regEmail" name="email" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="votre@email.com">
                </div>

                <div>
                    <label for="regPassword" class="block text-sm font-medium text-gray-700 mb-2">
                        Mot de passe
                    </label>
                    <input type="password" id="regPassword" name="password" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="••••••••">
                    <p class="text-xs text-gray-500 mt-1">Au moins 8 caractères avec une majuscule et un chiffre</p>
                </div>

                <div>
                    <label class="flex items-center">
                        <input type="checkbox" required class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        <span class="ml-2 text-sm text-gray-600">
                            J'accepte les <a href="#" class="text-blue-600 hover:text-blue-500">conditions d'utilisation</a>
                        </span>
                    </label>
                </div>

                <button type="submit" 
                        class="w-full bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-colors duration-200 flex items-center justify-center">
                    <svg id="registerSpinner" class="hidden animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span id="registerText">Créer mon compte gratuit</span>
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    Déjà un compte ?
                    <button onclick="showLoginForm()" class="text-blue-600 hover:text-blue-500 font-medium">
                        Se connecter
                    </button>
                </p>
            </div>
        </div>

        <!-- Features -->
        <div class="mt-8 text-center">
            <p class="text-sm text-gray-600 mb-4">Démarrez avec le plan gratuit :</p>
            <div class="flex justify-center space-x-6 text-xs text-gray-500">
                <div class="flex items-center">
                    <svg class="w-4 h-4 text-green-500 mr-1" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                    </svg>
                    1K caractères/mois
                </div>
                <div class="flex items-center">
                    <svg class="w-4 h-4 text-green-500 mr-1" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                    </svg>
                    Voix multilingues
                </div>
                <div class="flex items-center">
                    <svg class="w-4 h-4 text-green-500 mr-1" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                    </svg>
                    Sans engagement
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1/auth';

        // Gestion des formulaires
        function showRegisterForm() {
            document.getElementById('registerCard').classList.remove('hidden');
            document.getElementById('registerCard').scrollIntoView({ behavior: 'smooth' });
        }

        function showLoginForm() {
            document.getElementById('registerCard').classList.add('hidden');
        }

        // Affichage des messages
        function showMessage(message, type = 'info') {
            const alert = document.getElementById('alertMessage');
            alert.className = `mt-4 p-4 rounded-lg ${type === 'error' ? 'bg-red-100 text-red-700 border border-red-300' : 
                                                   type === 'success' ? 'bg-green-100 text-green-700 border border-green-300' : 
                                                   'bg-blue-100 text-blue-700 border border-blue-300'}`;
            alert.textContent = message;
            alert.classList.remove('hidden');
        }

        // Gestion de la connexion
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const spinner = document.getElementById('loginSpinner');
            const text = document.getElementById('loginText');
            
            spinner.classList.remove('hidden');
            text.textContent = 'Connexion...';
            
            const formData = new FormData(e.target);
            const data = {
                email: formData.get('email'),
                password: formData.get('password')
            };
            
            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    localStorage.setItem('token', result.access_token);
                    showMessage('Connexion réussie ! Redirection...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = '/dashboard/';
                    }, 1000);
                } else {
                    const error = await response.json();
                    showMessage(error.detail || 'Erreur de connexion', 'error');
                }
            } catch (error) {
                showMessage('Erreur de connexion au serveur', 'error');
            } finally {
                spinner.classList.add('hidden');
                text.textContent = 'Se connecter';
            }
        });

        // Gestion de l'inscription
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const spinner = document.getElementById('registerSpinner');
            const text = document.getElementById('registerText');
            
            spinner.classList.remove('hidden');
            text.textContent = 'Création du compte...';
            
            const formData = new FormData(e.target);
            const data = {
                email: formData.get('email'),
                password: formData.get('password'),
                full_name: formData.get('full_name')
            };
            
            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    localStorage.setItem('token', result.access_token);
                    showMessage('Compte créé avec succès ! Redirection...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = '/dashboard/';
                    }, 1000);
                } else {
                    const error = await response.json();
                    showMessage(error.detail || 'Erreur lors de la création du compte', 'error');
                }
            } catch (error) {
                showMessage('Erreur de connexion au serveur', 'error');
            } finally {
                spinner.classList.add('hidden');
                text.textContent = 'Créer mon compte gratuit';
            }
        });

        // Vérifier si l'utilisateur est déjà connecté
        if (localStorage.getItem('token')) {
            showMessage('Vous êtes déjà connecté. Redirection...', 'success');
            setTimeout(() => {
                window.location.href = '/dashboard/';
            }, 1000);
        }
    </script>
</body>
</html>
